##############################################################################
# render.yaml — Render.com deployment configuration
# Deploy this repo to Render and it will automatically read this file.
#
# IMPORTANT: Render injects $PORT automatically. Never hardcode a port.
# The Dockerfile CMD uses --bind "0.0.0.0:${PORT:-10000}" to pick it up.
##############################################################################

services:
  - type: web
    name: deeplearn-classroom
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

    # ── Environment Variables ─────────────────────────────────────────────────
    envVars:
      # Render injects PORT automatically — do NOT set it manually here.
      # The Dockerfile CMD reads it via ${PORT:-10000}.

      # SECRET_KEY: Auto-generated by Render on first deploy.
      - key: SECRET_KEY
        generateValue: true

      # Free-tier safe defaults (512MB RAM):
      # Whisper requires ~1GB RAM minimum — keep disabled on free tier.
      - key: RENDER
        value: "true"

      - key: USE_WHISPER
        value: "false"

      - key: WHISPER_MODEL
        value: tiny

      # CORS: list your Vercel frontend URL so cross-origin requests succeed.
      # Comma-separate multiple origins if needed, e.g.:
      #   https://deeplearn-classroom.vercel.app,https://deeplearn-classroom-git-main.vercel.app
      # The backend CORS parser in app.py splits on commas automatically.
      - key: CORS_ORIGINS
        value: "https://deeplearn-classroom.vercel.app,https://deeplearn-classroom-git-main-mdjunaid05.vercel.app,http://localhost:3000"

      # Python optimizations for container environment
      - key: PYTHONUNBUFFERED
        value: "1"

      - key: PYTHONDONTWRITEBYTECODE
        value: "1"

      # ── Cloudflare R2 Video Storage ─────────────────────────────────────────
      # Get these from: Cloudflare Dashboard → R2 → Manage R2 API Tokens
      # Leave blank to use local disk storage (not recommended for production).
      #
      # Step 1: Create bucket named "deeplearn-videos" in R2
      # Step 2: Enable "Public Access" on the bucket
      # Step 3: Create API Token with "Object Read & Write" on the bucket
      # Step 4: Paste values below (use Render's "Secret" type for keys)
      - key: R2_ACCOUNT_ID
        sync: false   # Set manually in Render dashboard (Cloudflare Account ID)

      - key: R2_ACCESS_KEY_ID
        sync: false   # Set manually in Render dashboard (R2 API Token Key ID)

      - key: R2_SECRET_ACCESS_KEY
        sync: false   # Set manually in Render dashboard (R2 API Token Secret)

      - key: R2_BUCKET_NAME
        value: "deeplearn-videos"

      # R2_PUBLIC_URL: from Cloudflare R2 bucket → Settings → Public URL
      # Looks like: https://pub-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx.r2.dev
      - key: R2_PUBLIC_URL
        sync: false   # Set manually in Render dashboard

      # Frontend URL for CORS (also included in CORS_ORIGINS)
      - key: FRONTEND_URL
        sync: false   # Set to your Vercel URL, e.g. https://deeplearn-classroom.vercel.app

    # Render polls this path every 30s. Must return HTTP 200 to stay live.
    healthCheckPath: /health

    # ── Persistent Disk ───────────────────────────────────────────────────────
    # NOTE: Persistent disk requires a paid Render plan.
    # On free tier, comment out the disk section below — files are ephemeral.
    # disk:
    #   name: deeplearn-data
    #   mountPath: /app/uploads
    #   sizeGB: 5
